<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOP.game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23FF4EB8%22/><text x=%2250%22 y=%2258%22 text-anchor=%22middle%22 font-family=%22system-ui,sans-serif%22 font-size=%2248%22 font-weight=%22700%22 fill=%22%23FFFFFF%22>S</text></svg>">
<!--
  GitHub Pages serves this file for any path it can't find on disk. We use it as
  a tiny client-side router so the pretty URLs work on the static site:
    /play/{slug}  → the browser player; room invites keep their native doorway
    /{username}   → the profile page (profile.html)
  Real files (js/, css/, games/, *.html …) are served directly and never hit this.
-->
<script>
(function () {
  var path = location.pathname.replace(/^\/+|\/+$/g, '');
  var parts = path ? path.split('/') : [];
  // top-level names that are real files/folders, not usernames
  var reserved = { invite:1, play:1, open:1, studio:1, index:1, profile:1, legacy:1, NewSite:1, js:1, css:1, assets:1,
                   games:1, scripts:1, supabase:1, '.well-known':1, 'apple-app-site-association':1,
                   'favicon.ico':1, 'robots.txt':1, 'sitemap.xml':1 };
  var search = location.search || '';
  if (parts.length === 2 && parts[0] === 'invite' && /^[a-f0-9]{8}$/i.test(parts[1]) && !search) {
    location.replace('/invite/?code=' + parts[1].toUpperCase());
  } else if (parts[0] === 'play' && parts[1]) {
    var incoming = new URLSearchParams(search);
    var roomInvite = incoming.has('room');
    var target = new URL(roomInvite ? '/open/' : '/web-player/', location.origin);
    var slug = '';
    try { slug = decodeURIComponent(parts[1]); } catch (_) {}
    if (parts.length === 2 && /^[a-z0-9][a-z0-9_-]{0,119}$/i.test(slug)) {
      target.searchParams.set(roomInvite ? 'game' : 'g', slug);
      ['beat', 'by', 'room'].forEach(function (key) {
        incoming.getAll(key).forEach(function (value) {
          target.searchParams.append(key, value);
        });
      });
    }
    location.replace(target.href);
  } else if (parts.length === 1 && parts[0] && !reserved[parts[0].toLowerCase()] && parts[0].indexOf('.') === -1) {
    location.replace('/profile.html?u=' + encodeURIComponent(parts[0]));
  } else {
    location.replace('/');
  }
})();
</script>
</head>
<body data-slop-play-router="v1"></body>
</html>
