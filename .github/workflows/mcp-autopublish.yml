name: MCP auto-publish

# Records and publishes games that owners asked their connected coding app to
# publish (Connect page → Auto-publish). slop-mcp accepts this workflow's OIDC
# token only from main, on a GitHub-hosted runner, for schedule or manual
# dispatch. The repository is public: the recorder never logs game source,
# names, ids or media, and uploads no artifacts.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-autopublish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Install web dependencies
        run: npm ci --ignore-scripts
      - name: Allow Chrome's sandbox on Ubuntu
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Record and publish queued games
        run: node scripts/mcp-publisher/run.mjs
